# ===================================================================
# TrustVault - Application Configuration
# Phase 1: Initial Baseline Setup
# ===================================================================

# Application Metadata
spring.application.name=trustvault
server.port=8080

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging Configuration
logging.level.com.trustvault=INFO
logging.level.org.springframework.web=INFO

# ===================================================================
# Database (MySQL) Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/trustvault?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Set to 'none' to ensure no database tables or schema changes are made automatically
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

