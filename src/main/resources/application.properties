# ===================================================================
# TrustVault - Application Configuration
# Phase 1: Initial Baseline Setup
# ===================================================================

# Application Metadata
spring.application.name=trustvault
server.port=8080

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging Configuration
logging.level.com.trustvault=INFO
logging.level.org.springframework.web=INFO

# ===================================================================
# Database (MySQL) Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/trustvault?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Set to 'none' to ensure no database tables or schema changes are made automatically
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================================================
# Multipart File Upload Configuration
# ===================================================================
# Maximum size of a single uploaded file (hard limit enforced by Spring before the controller)
spring.servlet.multipart.max-file-size=10MB
# Maximum size of the entire multipart request
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.enabled=true

# ===================================================================
# Document Storage Configuration
# ===================================================================
# Directory where uploaded files are stored (outside classpath / static resources).
# Defaults to a 'trustvault-uploads' subdirectory inside the OS temp dir when not set.
# Override with an absolute path in production, e.g.:
#   trustvault.storage.dir=/var/trustvault/uploads
trustvault.storage.dir=${java.io.tmpdir}/trustvault-uploads

