<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit document</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{fragments/nav :: main(${username}, ${isAdmin})}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}">Error</div>
    <section class="card">
        <h2>Edit metadata</h2>
        <form th:action="@{/documents/{id}/edit(id=${document.id})}" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" required maxlength="255" th:value="${document.name}">
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input id="category" name="category" type="text" maxlength="100" th:value="${document.category}">
            </div>
            <button type="submit" class="btn">Save</button>
            <a th:href="@{/documents}">Cancel</a>
        </form>
    </section>
</div>
</body>
</html>
